name: Integration QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Fresh migration
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan migrate --force
      - name: Full regression and cross-module tests
        run: php artisan test --compact
      - name: Concurrent shop requests
        run: vendor/bin/phpunit -c phpunit.concurrency.xml
